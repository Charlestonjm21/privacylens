<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrivacyLens — Compare</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="brand">PrivacyLens</a>
    <a href="index.html">Analyze</a>
    <a href="results.html">Results</a>
    <a href="compare.html" aria-current="page">Compare</a>
    <a href="history.html">History</a>
    <a href="about.html">About</a>
  </nav>

  <div class="card card-wide">

    <h1>Compare policies</h1>
    <p class="lede">Two policies scored on the same five categories.</p>

    <div id="compare-main">

      <div class="compare-controls">
        <div class="field">
          <label for="left-select">First policy</label>
          <select id="left-select"></select>
        </div>
        <div class="field">
          <label for="right-select">Second policy</label>
          <select id="right-select"></select>
        </div>
      </div>

      <table class="compare-table">
        <caption>Category scores, side by side</caption>
        <thead>
          <tr>
            <th scope="col">Category</th>
            <th scope="col" id="left-heading"></th>
            <th scope="col" id="right-heading"></th>
          </tr>
        </thead>
        <tbody id="compare-rows"></tbody>
      </table>

    </div>

    <div class="empty-state" id="compare-empty" hidden>
      <p class="empty-title">Not enough policies to compare</p>
      <p class="empty-body">
        Analyze at least two policies and you can line them up
        side by side here.
      </p>
      <a href="index.html" class="btn">Analyze a policy</a>
    </div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/history.js"></script>
  <script src="js/compare.js"></script>

</body>
</html>
