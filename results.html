<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrivacyLens — Results</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="brand">PrivacyLens</a>
    <a href="index.html">Analyze</a>
    <a href="results.html" aria-current="page">Results</a>
    <a href="compare.html">Compare</a>
    <a href="history.html">History</a>
    <a href="about.html">About</a>
  </nav>

  <div class="card">

    <div class="card-header">
      <div>
        <h1 id="site-name"></h1>
        <p class="meta" id="analyzed-date"></p>
      </div>
      <div class="score">
        <span class="score-value" id="overall-score"></span>
        <span class="score-label">Overall risk</span>
      </div>
    </div>

    <table>
      <caption>Privacy risk by category</caption>
      <thead>
        <tr>
          <th scope="col">Category</th>
          <th scope="col">Risk</th>
          <th scope="col">What this means</th>
        </tr>
      </thead>
      <tbody id="category-rows"></tbody>
    </table>

    <h2>Summary</h2>
    <p id="summary-text"></p>

  </div>

  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script>
    renderAnalysis(MOCK_ANALYSES["example-social.com"]);
  </script>

</body>
</html>
